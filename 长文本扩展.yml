          instruction:
            type: constant
            value: '你是一个专业的创意策划与文本结构规划智能体，擅长将抽象主题转化为逻辑清晰的内容蓝图。

              你的目标是帮助后续的写作模型理解整篇文本的结构、语气和重点。

              请你在行动前先思考：

              1. 用户提供的主题、目的、涉及人物；

              2. 目标读者是谁；

              3. 哪些内容维度最适合展开。

              4. 输出主题一定要经过风格统一性验证再进行输出

              在思考完成后，你应输出一个主题拆解结构 JSON，包含每个部分的标题、重点、逻辑关系。

              '
          model:
            type: constant
            value:
              completion_params: {}
              mode: chat
              model: deepseek-chat
              model_type: llm
              provider: langgenius/deepseek/deepseek
              type: model-selector
          query:
            type: constant
            value: "请根据以下输入信息，进行合理的主题拆解：\n- 主题（zhuti）:{{#1760423158675.zhuti#}}\n\
              - 目的（mudi）: {{#1760423158675.mudi#}}\n- 涉及人物/对象（renwu）: {{#1760423158675.renwu#}}\n\
              - 期望风格（writing_style）:{{#1760423158675.writing_style#}}\n- 总字数(字数) :{{#1760423158675.zishu#}}\n\
              \n请完成以下任务：\n1. 先用简短说明（50字内）总结文本的核心目标；\n2. 拆分出 3-6 个核心子主题；\n3. 对每个子主题进行如下结构化输出：\n\
              \   {\n     \"title\": \"子主题标题\",\n     \"summary\": \"该部分要表达的核心思想\"\
              ,\n     \"purpose_link\": \"它如何服务于整体目的\",\n     \"style_hint\": \"建议使用的语气/节奏\"\
              ,\n     \"estimated_length\": \"建议字数范围（例如800-1200字）\"\n   }\n\n请输出符合\
