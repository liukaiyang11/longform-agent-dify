          \ str(beijing)\n\n    # 去掉控制字符（防止隐藏符号导致 400）\n    beijing = re.sub(r'[\\\
          x00-\\x1f\\x7f]', '', beijing)\n\n    # 去掉多余空白（前后）\n    beijing = beijing.strip()\n\
          \n    # 使用 json.dumps 进行安全转义（这一步最关键）\n    # ensure_ascii=False 让中文保持原样，不会变成\
          \ \\uXXXX\n    safe_beijing = json.dumps(beijing, ensure_ascii=False)\n\n\
          \    # json.dumps 会在首尾加双引号，需要去掉\n    if safe_beijing.startswith('\"') and\
          \ safe_beijing.endswith('\"'):\n        safe_beijing = safe_beijing[1:-1]\n\
          \n    return {\n        \"beijing\": safe_beijing\n    }\n"
